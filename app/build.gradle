plugins {
	id 'com.android.application'
	id 'kotlin-android'
}

repositories {
	flatDir {
		dirs 'libs'
	}
}

def loadLocalProperties() {
	def props = new Properties()
	def localPropsFile = rootProject.file("local.properties")
	if (localPropsFile.exists()) {
		localPropsFile.withInputStream { stream -> props.load(stream) }
	}
	return props
}

def localProps = loadLocalProperties()
def tuyaAppKey = (localProps.getProperty("tuya.appKey") ?: "")
def tuyaAppSecret = (localProps.getProperty("tuya.appSecret") ?: "")
def tuyaAppKeyKuggo = (localProps.getProperty("tuya.appKeyKuggo") ?: "")
def tuyaAppSecretKuggo = (localProps.getProperty("tuya.appSecretKuggo") ?: "")
def tuyaAppL = (localProps.getProperty("tuya.appLogin") ?: "")
def tuyaAppP = (localProps.getProperty("tuya.appPassword") ?: "")

android {
	compileSdkVersion 33
	
	useLibrary 'org.apache.http.legacy'
	
	defaultConfig {
		applicationId "sc.denishik.ru"
		minSdkVersion 23
		targetSdkVersion 33
		versionCode 6
		versionName "1.0.4_dev"

		// Use generic Tuya keys (tuya.appKey/tuya.appSecret) for package sc.denishik.ru.
		// (Kuggo OEM keys are typically bound to a different package/signature.)
		def resolvedAppKey = tuyaAppKey
		def resolvedAppSecret = tuyaAppSecret

		buildConfigField "String", "TUYA_APP_KEY", "\"${resolvedAppKey}\""
		buildConfigField "String", "TUYA_APP_SECRET", "\"${resolvedAppSecret}\""
		// Names matching official OEM app BuildConfig conventions.
		buildConfigField "String", "THING_SMART_APPKEY", "\"${resolvedAppKey}\""
		buildConfigField "String", "THING_SMART_SECRET", "\"${resolvedAppSecret}\""
		buildConfigField "String", "TUYA_APP_Login", "\"${tuyaAppL}\""
		buildConfigField "String", "TUYA_APP_Password", "\"${tuyaAppP}\""

		compileOptions {
			sourceCompatibility JavaVersion.VERSION_1_8
			targetCompatibility JavaVersion.VERSION_1_8
		}
	}
	
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
        debug {
            debuggable true
        }
    }

	packagingOptions {
		pickFirst 'lib/**/libc++_shared.so'
	}
}

configurations.configureEach {
	resolutionStrategy.dependencySubstitution {
		// Tuya Maven hosts `thingsmart-modularCampAnno` as a release (2.8.1),
		// but some `thingsmart-*` POMs reference a non-existent `1.0.0-SNAPSHOT`.
		substitute module('com.thingclips.smart:thingsmart-modularCampAnno:1.0.0-SNAPSHOT') using module('com.thingclips.smart:thingsmart-modularCampAnno:2.8.1')
	}
}

dependencies {
	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.json:json:20240303'
	implementation fileTree(dir: 'libs', include: ['*.jar'])
	implementation 'androidx.appcompat:appcompat:1.2.0'
	implementation 'com.google.android.material:material:1.4.0'
	implementation 'com.google.android.gms:play-services-maps:17.0.1'
	implementation 'com.squareup.okhttp3:okhttp:4.9.2'
	implementation 'com.google.code.gson:gson:2.9.0'
	implementation 'cn.wandersnail:easyble-x:1.4.7'
	implementation 'cn.wandersnail:commons-android:1.3.7'
	implementation 'com.blankj:utilcode:1.30.7'
	implementation "io.netty:netty-all:4.0.15.Final"
	implementation 'com.yandex.android:maps.mobile:4.3.2-full'
	implementation "tech.gusavila92:java-android-websocket-client:1.2.2"

	// Thingclips/Tuya Smart Life App SDK (OEM apps like Kugoo Riding)
	// NOTE: Tuya OEM portal versioning (e.g. v7.5.x) does not match Maven versioning.
	// The latest available in Tuya Maven at the moment is 5.17.2.
	implementation 'com.thingclips.smart:thingsmart:5.17.2'
	implementation 'com.alibaba:fastjson:1.1.67.android'
	implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.14.9'

	// Optional OEM security module bundle (provided as local AAR)
	implementation(name: 'security-algorithm-1.0.0-beta', ext: 'aar')

}
