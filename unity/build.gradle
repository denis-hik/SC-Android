plugins {
    id 'com.android.library'
}

android {
    compileSdk 33

    defaultConfig {
        minSdk 29
        targetSdk 33

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation "tech.gusavila92:java-android-websocket-client:1.2.2"
    implementation 'com.blankj:utilcode:1.30.7'
    implementation "io.netty:netty-all:4.0.15.Final"
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'cn.wandersnail:easyble-x:1.4.7'
    implementation 'cn.wandersnail:commons-android:1.3.7'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
	//noinspection GradlePath
	compileOnly files('D:/U/2022.3.6f1/Editor/Data/PlaybackEngines/AndroidPlayer/Variations/mono/Release/Classes/classes.jar')
}

task copyPlugin(type: Copy) {
    dependsOn assemble
    from ('build/outputs/aar')
    into ('D:/unity/My project/Assets/Plugins/Android')
    include (project.name + '-release.aar')
}